[project]
name = "overshare"
version = "0.1.0"
description = "Passive security scanner for AI-generated web apps (Tier A)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The CLI is the primary distribution channel and stays dependency-light; the
# hosted API is opt-in. Install with: pip install overshare[api]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
overshare = "overshare.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["overshare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
