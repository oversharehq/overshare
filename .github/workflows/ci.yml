name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The floor and the version the Action defaults to. Anything in between
      # that breaks will break at one of these two ends first.
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[api,dev]"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  action:
    # Proves the composite action still resolves and installs. It scans the
    # bundled vulnerable app rather than a live site, so CI never sends traffic
    # to a third party.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Scan the bundled vulnerable app
        run: |
          python testdata/serve_vulnerable_app.py &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ >/dev/null && break
            sleep 0.5
          done
          overshare http://127.0.0.1:8000/ \
            --unsafe-allow-private-ips --no-footprint \
            --fail-on never --sarif-file overshare.sarif
      # A malformed SARIF is not a loud failure — GitHub just ignores the run and
      # the Security tab stays empty, which looks identical to a clean scan.
      - name: Check the SARIF is well formed
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema --schemafile https://json.schemastore.org/sarif-2.1.0.json \
            overshare.sarif
