# Frontend.  Deploy from this directory:  cd web && fly deploy
#
# This is the only app with a public address. Everything the browser calls goes
# to this origin and is proxied server-side to the API over the private network
# (app/api/v1/[...path]/route.ts), which is why the API needs no CORS.

app = "overshare-web"
primary_region = "syd"

[build]
  [build.args]
    # Build-time, not runtime. sitemap.xml, robots.txt and canonical URLs are
    # prerendered, so this has to be right at image build. Deploy with the
    # default and you ship a live site whose sitemap advertises localhost —
    # which is silent, and which search engines will happily index.
    NEXT_PUBLIC_SITE_URL = "https://oversharehq.com"

    # Pre-launch: the site is live but must not be indexed. Flip to "true" and
    # rebuild only once M4 calibration has produced a real false-positive rate
    # and the todo markers are gone. Anything other than "true" means noindex,
    # so a typo fails closed rather than publishing.
    NEXT_PUBLIC_INDEXABLE = "false"

[env]
  # Fly private DNS. Runtime, so one image promotes between environments.
  OVERSHARE_API_URL = "http://overshare-api.internal:8000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  # Kept warm rather than scaled to zero: this is the marketing site, and a cold
  # start on the landing page is paid by exactly the visitor you least want to
  # lose. Set to 0 if cost matters more than first-paint latency.
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
